name: refresh la feeeeed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch posts
        env:
          WEIR_API_KEY: ${{ secrets.WEIR_API_KEY }}
        run: node la-feeeeed/fetch.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "la-feeeeed bot"
          git config user.email "actions@users.noreply.github.com"
          git add la-feeeeed/data
          git diff --cached --quiet && echo "no changes" || git commit -m "refresh la feeeeed"
          git push
